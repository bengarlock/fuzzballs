[Unit]
# FFmpeg already owns recovery. Disable the burst limiter so a long Protect
# outage cannot leave the bridge permanently failed.
StartLimitIntervalSec=0

[Service]
# systemd 254+ increases the delay across these steps and caps it at five
# minutes. This avoids the previous 100ms restart storm.
Restart=always
RestartSec=5s
RestartSteps=6
RestartMaxDelaySec=5min
TimeoutStopSec=20s
